services:
  db:
    image: postgres:18
    container_name: dashboardvente-db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Postgres 18 stocke les données ici (plus dans /var/lib/postgresql/data)
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
